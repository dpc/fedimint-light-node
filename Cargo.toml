[package]
name = "fedimint-light-node"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded-history Bitcoin backend for Fedimint guardians"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
base64 = "0.22"
bincode = "2.0.1"
bitcoin = "0.32.102"
clap = { version = "4.5", features = ["derive"] }
httparse = "1.10"
rand = "0.10.3"
redb = "3.1.3"
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls",
] }
serde_json = "1.0"
subtle = "2.6"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "signal",
  "sync",
  "time",
] }

[dev-dependencies]
bitcoincore-rpc = "=0.19.0"
jsonrpc = "=0.18.0"
tokio = { version = "1.48", features = ["macros", "rt", "sync", "test-util"] }

[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false

[profile.ci]
debug = false
incremental = false
inherits = "dev"
lto = "off"

[profile.ci.package."*"]
debug = false
